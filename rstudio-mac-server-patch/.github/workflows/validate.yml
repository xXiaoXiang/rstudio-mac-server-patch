name: Validate patch automation
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release selection and patch integrity
        run: python3 -m unittest discover -s tests -v
      - name: Check out the baseline upstream release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstudio/rstudio
          ref: v2026.11.0+203
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Verify patches apply to the baseline release
        run: python3 tools/release.py apply --source upstream --tag v2026.11.0+203
      - name: Check shell syntax
        run: bash -n tools/build-macos.sh
